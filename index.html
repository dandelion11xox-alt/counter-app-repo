<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Counter</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 border border-slate-700/50 shadow-2xl rounded-3xl p-8 sm:p-12 text-center max-w-sm w-full transition-all">
        <h1 class="text-slate-400 text-sm uppercase tracking-widest font-semibold mb-6">Counter</h1>
        
        <!-- Counter Display -->
        <div class="my-8">
            <span id="counterValue" class="text-7xl font-bold tracking-tight text-white transition-all duration-200 inline-block">
                0
            </span>
        </div>

        <!-- Buttons Controls -->
        <div class="flex items-center justify-center gap-4 mt-8">
            <button 
                id="decrementBtn" 
                class="w-16 h-16 rounded-2xl bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-slate-200 text-3xl font-semibold flex items-center justify-center transition-all transform active:scale-95 shadow-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
                aria-label="Decrement count">
                −
            </button>
            <button 
                id="incrementBtn" 
                class="w-16 h-16 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-400 text-white text-3xl font-semibold flex items-center justify-center transition-all transform active:scale-95 shadow-md focus:outline-none focus:ring-2 focus:ring-indigo-400"
                aria-label="Increment count">
                +
            </button>
        </div>

        <!-- Reset Button -->
        <div class="mt-6">
            <button 
                id="resetBtn" 
                class="text-xs text-slate-500 hover:text-slate-400 font-medium tracking-wide uppercase transition-colors px-3 py-1 rounded-lg">
                Reset
            </button>
        </div>
    </div>

    <script>
        // State management
        let count = 0;

        // DOM elements
        const counterValueEl = document.getElementById('counterValue');
        const incrementBtn = document.getElementById('incrementBtn');
        const decrementBtn = document.getElementById('decrementBtn');
        const resetBtn = document.getElementById('resetBtn');

        // Function to update state and UI
        function updateCount(newValue) {
            count = newValue;
            counterValueEl.textContent = count;
            
            // Subtle visual feedback animation
            counterValueEl.classList.add('scale-110');
            setTimeout(() => {
                counterValueEl.classList.remove('scale-110');
            }, 100);
        }

        // Event Listeners
        incrementBtn.addEventListener('click', () => {
            updateCount(count + 1);
        });

        decrementBtn.addEventListener('click', () => {
            updateCount(count - 1);
        });

        resetBtn.addEventListener('click', () => {
            updateCount(0);
        });
    </script>
</body>
</html>
